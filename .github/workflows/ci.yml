# The gate from root AGENTS.md → Verification, on every PR to develop/main and
# every push to them (#794). The commands live in scripts/ci/gate.sh so another
# CI can run the same stages; this file only provides Node, pnpm and Postgres.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: the FE Biome gate diffs merge-base(HEAD, base)..HEAD.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, boundaries, migration drift, FE typecheck, design lint, FE Biome
        run: scripts/ci/gate.sh static ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}

  unit:
    name: Unit tests (frontend, ui, shared)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/gate.sh unit

  integration:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/gate.sh integration
        env:
          CI_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
