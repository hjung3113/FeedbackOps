map "$request_method:$http_accept" $spa_navigation {
  default 0;
  "~*^(GET|HEAD):.*text/html" 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 26m;

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Login, callback, attachment downloads/uploads, and health probes are
  # backend endpoints even when a browser sends Accept: text/html.
  location ~ ^/(auth|attachments|health)(/|$) {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_redirect off;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    proxy_pass_header Set-Cookie;
  }

  location / {
    error_page 418 = @backend;
    if ($spa_navigation = 0) {
      return 418;
    }
    try_files $uri /index.html;
  }

  location @backend {
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_redirect off;
    proxy_pass_request_headers on;
    proxy_pass_request_body on;
    proxy_pass_header Set-Cookie;
  }
}
