<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FeedbackOps 사용자 안내</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f7fe;
      --surface: #fbfdff;
      --elevated: #edf3fb;
      --border: #cbd6e6;
      --border-strong: #b8c4d6;
      --text: #101828;
      --secondary: #374151;
      --muted: #667083;
      --accent: #1428a0;
      --success: #10734a;
      --warning: #8e5500;
      --danger: #b2202b;
      --info: #006f94;
      --shadow: 0 8px 24px rgb(16 24 40 / 8%);
      --focus: 0 0 0 3px rgb(20 40 160 / 24%);
      --font: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #0c111d;
        --surface: #131a2a;
        --elevated: #1a2337;
        --border: #28324a;
        --border-strong: #3a4661;
        --text: #e8edf6;
        --secondary: #bcc6d8;
        --muted: #8a95ab;
        --accent: #9aabff;
        --success: #5dd09a;
        --warning: #f5bd62;
        --danger: #ff858a;
        --info: #65c9e9;
        --shadow: 0 8px 28px rgb(0 0 0 / 24%);
        --focus: 0 0 0 3px rgb(154 171 255 / 28%);
      }
    }
    html[data-theme='dark'] {
      color-scheme: dark;
      --bg: #0c111d;
      --surface: #131a2a;
      --elevated: #1a2337;
      --border: #28324a;
      --border-strong: #3a4661;
      --text: #e8edf6;
      --secondary: #bcc6d8;
      --muted: #8a95ab;
      --accent: #9aabff;
      --success: #5dd09a;
      --warning: #f5bd62;
      --danger: #ff858a;
      --info: #65c9e9;
      --shadow: 0 8px 28px rgb(0 0 0 / 24%);
      --focus: 0 0 0 3px rgb(154 171 255 / 28%);
    }
    html[data-theme='light'] { color-scheme: light; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 20px; }
    body {
      margin: 0;
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 var(--font);
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    a { color: var(--accent); text-underline-offset: 3px; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: none; box-shadow: var(--focus); }
    code, kbd { font-family: var(--mono); font-size: .92em; }
    code { overflow-wrap: anywhere; }
    .skip-link {
      position: fixed; z-index: 100; top: 8px; left: 8px; transform: translateY(-150%);
      padding: 8px 12px; border-radius: 8px; background: var(--surface); color: var(--text);
    }
    .skip-link:focus { transform: none; }
    .guide-header {
      display: grid; grid-template-columns: minmax(240px, 1fr) auto; gap: 18px;
      align-items: end; padding: 22px clamp(16px, 3vw, 44px) 18px;
      border-bottom: 1px solid var(--border); background: var(--surface);
    }
    .eyebrow { margin: 0 0 3px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; letter-spacing: -.035em; }
    .header-summary { margin: 7px 0 0; color: var(--secondary); }
    .header-controls { display: grid; justify-items: end; gap: 9px; }
    .role-filter, .header-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .control-label { margin-right: 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .pill-button, .icon-button, .small-button, .action-button {
      border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface);
      padding: 6px 10px; cursor: pointer;
    }
    .pill-button[aria-pressed='true'], .small-button.primary, .action-button.primary {
      border-color: var(--accent); background: var(--accent); color: var(--surface);
    }
    .search-wrap { display: flex; align-items: center; gap: 8px; width: min(100%, 400px); }
    .search-wrap input {
      width: 280px; max-width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--border-strong);
      border-radius: 8px; color: var(--text); background: var(--surface);
    }
    #search-status { min-width: 78px; color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: 252px minmax(0, 1fr); align-items: start; gap: 24px; padding: 22px clamp(16px, 3vw, 44px) 44px; }
    .sidebar { position: sticky; top: 16px; min-width: 0; max-height: calc(100dvh - 32px); overflow: auto; }
    .nav-toggle { display: none; width: 100%; text-align: left; }
    .guide-nav { display: grid; gap: 3px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .nav-label { margin: 12px 8px 4px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .nav-label:first-child { margin-top: 2px; }
    .nav-link { display: block; padding: 6px 8px; border-radius: 7px; color: var(--secondary); font-size: 12px; text-decoration: none; }
    .nav-link:hover, .nav-link[aria-current='location'] { background: var(--elevated); color: var(--text); }
    .nav-link[aria-current='location'] { box-shadow: inset 3px 0 var(--accent); font-weight: 700; }
    main { min-width: 0; max-width: 1180px; }
    .chapter, .tour-section, .screen-index {
      min-width: 0; margin: 0 0 20px; padding: clamp(16px, 2.3vw, 26px);
      border: 1px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow);
    }
    .chapter.muted { border-style: dashed; }
    .chapter.muted .chapter-copy, .chapter.muted .screen-grid { opacity: .68; }
    .chapter-header { display: flex; justify-content: space-between; gap: 14px; align-items: start; margin-bottom: 14px; }
    .chapter-header h2, .tour-section h2, .screen-index h2 { margin: 0; font-size: clamp(18px, 2vw, 23px); line-height: 1.3; letter-spacing: -.02em; }
    .chapter-kicker { margin: 0 0 4px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; }
    .role-note { display: none; margin: 0 0 16px; padding: 9px 11px; border-left: 3px solid var(--warning); background: var(--elevated); color: var(--secondary); }
    .chapter.muted .role-note { display: block; }
    .chapter-copy { color: var(--secondary); }
    .chapter-copy > :first-child { margin-top: 0; }
    .chapter-copy > :last-child { margin-bottom: 0; }
    .chapter-copy h3 { margin: 20px 0 7px; color: var(--text); font-size: 16px; }
    .chapter-copy p { margin: 9px 0; }
    .chapter-copy ul, .chapter-copy ol { padding-left: 22px; }
    .chapter-copy li + li { margin-top: 4px; }
    .chapter-copy blockquote, .callout { margin: 13px 0; padding: 10px 13px; border-left: 3px solid var(--info); background: var(--elevated); color: var(--text); }
    .chapter-copy table, .permission-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
    th, td { padding: 8px 9px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: var(--elevated); color: var(--text); }
    .state-board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
    .state-lane { min-width: 0; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--elevated); }
    .state-lane h3 { margin: 0 0 9px; font-size: 14px; }
    .state-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .state-choice { border: 1px solid var(--border-strong); border-radius: 999px; padding: 4px 8px; background: var(--surface); color: var(--secondary); font-size: 12px; cursor: pointer; }
    .state-choice[aria-pressed='true'] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .state-arrow { color: var(--muted); }
    .state-note { min-height: 38px; margin: 8px 0 0; color: var(--secondary); font-size: 12px; }
    .state-separation { grid-column: 1 / -1; padding: 11px 13px; border: 1px solid var(--warning); border-radius: 9px; color: var(--text); text-align: center; font-weight: 750; }
    .state-separation span { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
    .screen-grid { display: grid; gap: 14px; margin-top: 18px; }
    .screen-card { min-width: 0; padding: 13px; border: 1px solid var(--border); border-radius: 11px; background: var(--bg); }
    .screen-card h3 { margin: 0; font-size: 15px; }
    .screen-description { margin: 4px 0 10px; color: var(--muted); font-size: 12px; }
    .screen-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(190px, 245px); gap: 12px; align-items: start; }
    .shot-media { position: relative; min-width: 0; overflow: hidden; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--elevated); }
    .shot-media img { display: block; width: 100%; max-width: 100%; height: auto; }
    .shot-media.has-active::after { position: absolute; z-index: 1; inset: 0; background: rgb(8 13 25 / 48%); content: ''; pointer-events: none; }
    .hotspot {
      position: absolute; z-index: 2; min-width: 20px; min-height: 20px; display: grid; place-items: start;
      padding: 0; border: 2px solid #fff; border-radius: 5px; background: rgb(20 40 160 / 12%);
      box-shadow: 0 0 0 2px var(--accent), 0 2px 6px rgb(0 0 0 / 38%); cursor: pointer;
    }
    .hotspot span { position: absolute; top: -10px; left: -10px; display: grid; width: 22px; height: 22px; place-items: center; border: 2px solid var(--surface); border-radius: 50%; background: var(--accent); color: var(--surface); font: 700 11px/1 var(--font); }
    .hotspot[aria-pressed='true'] { z-index: 3; background: rgb(255 221 89 / 20%); box-shadow: 0 0 0 3px #ffdc5e, 0 0 16px #ffdc5e; }
    .shot-actions { display: flex; justify-content: end; margin-top: 6px; }
    .small-button { padding: 4px 9px; font-size: 12px; }
    .hotspot-legend { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .hotspot-legend button { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); text-align: left; cursor: pointer; }
    .hotspot-legend button[aria-pressed='true'] { border-color: var(--accent); box-shadow: inset 3px 0 var(--accent); }
    .legend-title { display: block; color: var(--text); font-size: 12px; font-weight: 750; }
    .legend-claim { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .screen-index-intro { color: var(--secondary); }
    .screen-group { margin: 15px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .screen-group > summary { padding: 10px 12px; color: var(--text); font-weight: 750; cursor: pointer; }
    .screen-catalog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 10px 10px; }
    .screen-catalog > .screen-card { grid-column: 1 / -1; }
    .catalog-card { min-width: 0; display: grid; grid-template-columns: minmax(100px, 36%) minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
    .catalog-card img { display: block; width: 100%; max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 5px; cursor: zoom-in; }
    .catalog-card h3 { margin: 0; font-size: 13px; }
    .catalog-card p { margin: 4px 0; color: var(--muted); font-size: 11px; }
    .catalog-card a { font-size: 11px; }
    .tour-section { scroll-margin-top: 18px; }
    .tour-intro { color: var(--secondary); }
    .tour-layout { display: grid; grid-template-columns: minmax(180px, .7fr) minmax(0, 1.3fr); gap: 16px; margin-top: 14px; }
    .tour-steps { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .tour-steps button { width: 100%; padding: 7px 9px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--secondary); text-align: left; cursor: pointer; }
    .tour-steps button[aria-current='step'] { border-color: var(--border); background: var(--elevated); color: var(--text); font-weight: 750; }
    .tour-current { min-width: 0; padding: 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--elevated); }
    .tour-current h3 { margin: 0 0 6px; font-size: 18px; }
    .tour-current p { margin: 7px 0; }
    .tour-meta { color: var(--muted); font-size: 12px; }
    .tour-progress { height: 6px; margin: 10px 0 14px; overflow: hidden; border-radius: 6px; background: var(--border); }
    .tour-progress span { display: block; height: 100%; background: var(--accent); transition: width .18s ease; }
    .tour-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 13px; }
    .tour-actions button { min-width: 78px; }
    .role-row-active { outline: 2px solid var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
    .role-badge { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 7px; border: 1px solid var(--border); border-radius: 99px; color: var(--secondary); font-size: 11px; }
    .term-wrap { position: relative; display: inline; }
    .term-button { padding: 0; border: 0; border-bottom: 1px dotted var(--accent); background: transparent; color: inherit; font-weight: 750; cursor: help; }
    .term-popover { position: absolute; z-index: 20; bottom: calc(100% + 6px); left: 0; width: min(260px, 70vw); padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); color: var(--secondary); box-shadow: var(--shadow); font-size: 12px; }
    .footer { padding: 18px clamp(16px, 3vw, 44px) 28px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    .footer p { max-width: 1100px; margin: 4px 0; }
    dialog#viewer { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--bg); color: var(--text); }
    dialog#viewer::backdrop { background: rgb(5 8 16 / 92%); }
    .viewer-shell { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; width: 100%; height: 100%; padding: 14px clamp(12px, 3vw, 32px); }
    .viewer-header, .viewer-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .viewer-header p, .viewer-footer p { margin: 0; color: var(--secondary); }
    .viewer-stage { display: grid; min-height: 0; place-items: center; }
    .viewer-stage img { display: block; max-width: 100%; max-height: calc(100dvh - 120px); object-fit: contain; }
    .viewer-controls { display: flex; flex-wrap: wrap; gap: 6px; }
    .empty-state { padding: 12px; color: var(--muted); }
    [hidden] { display: none !important; }
    @media (min-width: 1000px) {
      .sidebar { top: 16px; }
      .nav-toggle { display: none; }
      .guide-nav { display: grid !important; }
    }
    @media (max-width: 999px) {
      .guide-header { grid-template-columns: 1fr; align-items: start; }
      .header-controls { justify-items: start; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .sidebar { position: static; max-height: none; }
      .nav-toggle { display: block; }
      .guide-nav { display: none; margin-top: 8px; }
      .guide-nav.is-open { display: grid; }
      .screen-row { grid-template-columns: minmax(0, 1fr); }
      .hotspot-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .layout { padding-top: 12px; }
      .guide-header { padding-top: 16px; }
      .role-filter { gap: 4px; }
      .pill-button { padding: 5px 8px; }
      .state-board, .tour-layout, .screen-catalog { grid-template-columns: minmax(0, 1fr); }
      .catalog-card { grid-template-columns: 110px minmax(0, 1fr); }
      .hotspot-legend { grid-template-columns: minmax(0, 1fr); }
      .chapter-header { display: block; }
      .chapter, .tour-section, .screen-index { padding: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#guide-main">본문으로 건너뛰기</a>
  <header class="guide-header">
    <div>
      <p class="eyebrow">FeedbackOps · 사용자 안내</p>
      <h1>하려는 일부터 찾는 안내서</h1>
      <p class="header-summary">매뉴얼의 흐름을 따라 화면과 상태를 살펴봅니다.</p>
    </div>
    <div class="header-controls">
      <div class="role-filter" id="role-filter" role="group" aria-label="역할 필터"></div>
      <div class="header-actions">
        <button class="icon-button" id="theme-toggle" type="button" aria-pressed="false">어두운 테마</button>
        <label class="search-wrap" for="guide-search">
          <span class="control-label">검색</span>
          <input id="guide-search" type="search" autocomplete="off" placeholder="한국어로 찾기">
        </label>
        <output id="search-status" aria-live="polite">전체 안내</output>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="안내서 탐색">
      <button class="nav-toggle small-button" id="nav-toggle" type="button" aria-expanded="false" aria-controls="guide-nav">목차 펼치기</button>
      <nav class="guide-nav" id="guide-nav" aria-label="안내서 목차"></nav>
    </aside>
    <main id="guide-main" tabindex="-1"></main>
  </div>
  <footer class="footer" id="guide-footer"></footer>
  <dialog id="viewer" aria-label="스크린샷 확대 보기">
    <div class="viewer-shell">
      <div class="viewer-header">
        <p id="viewer-title"></p>
        <div class="viewer-controls">
          <button class="small-button" id="viewer-prev" type="button" aria-label="이전 화면">← 이전</button>
          <button class="small-button" id="viewer-next" type="button" aria-label="다음 화면">다음 →</button>
          <button class="small-button" id="viewer-close" type="button">닫기 Esc</button>
        </div>
      </div>
      <div class="viewer-stage"><img id="viewer-image" alt=""></div>
      <div class="viewer-footer"><p id="viewer-caption"></p><p>← / → 이동 · Esc 닫기</p></div>
    </div>
  </dialog>
  <script>
    const hit = (element, pixels, label, claim, source) => ({
      element,
      box: [pixels[0] / 14.4, pixels[1] / 9.6, pixels[2] / 14.4, pixels[3] / 9.6],
      pixels,
      label,
      claim,
      source
    });

    const GUIDE = {
      capture: { date: '2026-10-04', commit: '859cf4aa', viewport: '1440×960' },
      roles: [
        { id: 'all', label: '전체' },
        { id: 'admin', label: 'Admin' },
        { id: 'developer', label: 'Developer' },
        { id: 'user', label: 'User' }
      ],
      glossary: {
        VOC: '하나의 Managed System에 대한 하나의 피드백입니다. 리포터에게 보이는 상태와 내부 처리 상태를 따로 갖습니다.',
        Finding: '근거에 기반한 판단입니다. 피드백에서 실행 후보로 넘어가는 다리입니다.',
        'Task Request': '검토를 거치지 않은 후보가 Task 백로그에 바로 들어가지 않도록 하는 실행 작업 후보입니다.',
        Task: '실제로 수행하는 내부 실행 작업이며 리포터 상태와 독립된 상태를 가집니다.',
        'Entity link': '서로 다른 레코드 사이의 저장된 연결로, 교차 시스템의 추적 경로를 만듭니다.',
        'Managed System': 'FeedbackOps가 피드백과 개선 작업을 추적하는 사내 시스템입니다.',
        'Analytics Area': '하나의 Managed System 안에 있는 분석 메뉴, 보고서 그룹 또는 업무 분석 영역입니다.'
      },
      chapters: [
        {
          id: 'ch-0', number: 0, nav: '시작하기', title: '0. 5분 안에 알아야 할 것',
          audience: ['admin', 'developer', 'user'], permission: '누구나 읽을 수 있습니다.', screens: ['home-dashboard', 'command-palette'],
          copy: `
            <h3>다섯 개의 개념</h3>
            <table><thead><tr><th>개념</th><th>무엇인가</th></tr></thead><tbody>
              <tr><th>VOC</th><td>하나의 Managed System에 대한 하나의 피드백. 리포터에게 보이는 상태와 내부 처리 상태를 <strong>따로</strong> 갖습니다.</td></tr>

            <p><strong>필요 권한:</strong> 읽기는 <code>survey.read</code>, 만들고 운영하는 것은 <code>survey.manage</code>. Admin은 둘 다 역할로 가집니다. 해당 권한에 명시적 거부가 있으면 거부가 이깁니다.</p>
            <p><code>Surveys</code> (<code>/surveys</code>)로 갑니다.</p>
            <h3>수명 주기</h3>
            <p><code>draft</code> (편집 가능) → <code>open</code> (응답 수집) → <code>closed</code> (결과 확정)</p>
            <p><code>draft</code>일 때만 질문을 편집할 수 있습니다. 열고 나면 문항이 고정되므로 질문 순서 변경·추가·삭제는 초안 단계에서 끝냅니다.</p>
            <h3>결과 보기</h3>
            <p><code>/surveys/{id}/results</code>에서 집계를 봅니다. 응답이 5건 미만인 구간은 표시되지 않습니다. 필터를 걸어 대상을 좁혔을 때도 같고, 필터를 바꿔 특정인의 응답을 역산하는 것도 막습니다. Workspace Admin이라고 기준이 완화되지 않습니다.</p>
            <p>개별 응답 원문은 <code>survey.read_personal_responses</code>, 내려받기는 <code>survey.export</code>가 따로 필요합니다. 이 둘은 Admin도 역할로 우회할 수 없고 명시적 권한을 받아야 합니다.</p>
            <p>자유 응답을 Finding 근거로 쓰려면 가림 처리 후 승인을 거쳐야 발췌가 붙습니다.</p>
            <h3>저조한 응답의 후속 조치</h3>
            <p>응답 수가 익명성 기준 이상인 닫힌 <code>Outcome</code> 설문에 미해결 저조 평점 응답이 있으면 결과 화면에 후속 조치 안내가 나타납니다. <code>survey.read_personal_responses</code>가 있으면 <code>후속 조치</code>를 열어 응답별 화면을 확인합니다.</p>
            <p>응답에 승인된 발췌가 있으면 Finding을 만들 수 있습니다. 후속 조치가 필요 없으면 <code>후속 조치 없음…</code>을 선택하고 사유를 기록합니다. Finding 생성과 두 결정에는 해당 Managed System의 <code>finding.manage</code>가 필요합니다. 다시 판단하려면 <code>다시 열기…</code>를 선택하고 새 사유를 기록합니다.</p>
            <!-- Source: docs/design/07-survey-system.md lines 5-8, 53-79, and 116-139. Survey participation and respondent history stay in Survey; responses do not create VOC. -->
            <p>인증된 사용자는 <code>survey.read</code> 없이 응답 가능한 open Survey 목록을 확인해 참여할 수 있습니다. 참여 화면에서는 응답 Survey와 내가 제출한 응답 이력을 확인합니다. Survey Response는 VOC로 변환되지 않습니다.</p>
          `
        },

    const esc = (value) => String(value).replace(/[&<>"']/g, (character) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);

    function chapterScreen(screenId, chapterId, groupIds) {
      const screen = screensById[screenId];
      if (!screen) return '';
      const sourceComment = screen.sourceComment ? `<!-- Source: ${esc(screen.sourceComment)}. -->` : '';
      const catalogAttribute = chapterId === 'screens' ? `data-catalog-card="${screen.id}"` : '';
      const hotspots = screen.hotspots.map((spot, index) => `
        <button class="hotspot" type="button" data-hotspot-screen="${screen.id}" data-hotspot-index="${index}"
          aria-label="${index + 1}. ${esc(spot.label)}" aria-pressed="false"
          style="left:${spot.box[0]}%;top:${spot.box[1]}%;width:${spot.box[2]}%;height:${spot.box[3]}%"><span>${index + 1}</span></button>
      `).join('');
      const legend = screen.hotspots.map((spot, index) => `
        ${(() => {
          const sources = spot.source.split('; ').filter((source) => /^(CONTEXT\.md|docs\/design\/|화면 캡처:)/.test(source));
          return sources.length ? `<!-- Source: ${esc(sources.join('; '))}. -->` : '';
        })()}
        <li><button type="button" data-hotspot-screen="${screen.id}" data-hotspot-index="${index}" aria-pressed="false">
          <span class="legend-title">${index + 1}. ${esc(spot.label)}</span><span class="legend-claim">${esc(spot.claim)}</span>
        </button></li>
      `).join('');
      return `
        <article class="screen-card" ${catalogAttribute} data-screen-card="${screen.id}">
          <h3>${esc(screen.title)}</h3>
          <p class="screen-description">${esc(screen.description)} ${sourceComment}</p>
          <div class="screen-row">
            <div>
              <div class="shot-media" data-shot-media="${screen.id}">
                <img src="screens/${screen.id}.webp" alt="${esc(screen.alt)}" loading="lazy" width="1440" height="960">
                ${hotspots}
              </div>
              <div class="shot-actions"><button class="small-button" type="button" data-open-screen="${screen.id}" data-open-group="${groupIds.join(',')}">확대</button></div>
            </div>
            <ol class="hotspot-legend" aria-label="${esc(screen.title)} 화면 설명">${legend}</ol>
          </div>
        </article>
      `;
    }

    function renderStateBoard() {
      const lanes = GUIDE.states.map((group) => {
        const renderChoices = (ids, separator = '→') => ids.map((id, index) => `
          ${index ? `<span class="state-arrow" aria-hidden="true">${separator}</span>` : ''}
          <button class="state-choice" type="button" data-state-group="${group.id}" data-state="${id}" aria-pressed="false">${esc(id)}</button>
        `).join('');
        const mainFlow = renderChoices(group.flow);
        const alternatives = group.alternatives?.length
          ? `<div class="state-flow" aria-label="${esc(group.title)} 대안 상태"><span class="state-arrow">또는</span>${renderChoices(group.alternatives, '/')}</div>`
          : '';
        const links = group.links?.map(([anchor, id]) => `<div class="state-flow branch-flow" aria-label="${esc(group.title)} 연결 상태"><span class="state-arrow">${esc(anchor)} ↕</span><button class="state-choice" type="button" data-state-group="${group.id}" data-state="${id}" aria-pressed="false">${esc(id)}</button></div>`).join('') || '';
        const branches = group.branches?.map((pair) => `<div class="state-flow branch-flow" aria-label="${esc(group.title)} 분기"><span class="state-arrow" aria-hidden="true">${esc(pair[0])} →</span><button class="state-choice" type="button" data-state-group="${group.id}" data-state="${pair[1]}" aria-pressed="false">${esc(pair[1])}</button></div>`).join('') || '';
        return `<section class="state-lane"><h3>${esc(group.title)}</h3><div class="state-flow">${mainFlow}</div>${alternatives}${links}${branches}<p class="state-note" data-state-note="${group.id}" aria-live="polite">상태를 누르면 매뉴얼에 적힌 설명을 볼 수 있습니다.</p></section>`;
      }).join('');
      return `<div class="state-board" aria-label="클릭 가능한 상태 흐름">${lanes}<div class="state-separation">리포터 상태 ↔ Task 상태는 자동 연동되지 않음<span>두 상태 흐름은 각각 담당자가 검토하고 기록합니다.</span></div></div>`;
    }

    function renderFaq() {

    function renderPermissions() {
      const roleRows = GUIDE.permissionRoles.map((item) => `

      const rightRows = GUIDE.adminRights.map((item) => `<tr><th><code>${esc(item[0])}</code></th><td>${esc(item[1])}</td></tr>`).join('');
      return `
        <h3>역할</h3>
        <table class="permission-table"><thead><tr><th>역할</th><th>무엇을 하는 사람인가</th></tr></thead><tbody>${roleRows}</tbody></table>
        <h3>데모 시드(<code>SEED_MODE=personas</code>) 권한</h3>
        <table class="permission-table"><thead><tr><th>액터</th><th>역할</th><th>부여된 권한</th></tr></thead><tbody>${demoRows}</tbody></table>
        <h3>Admin이 역할만으로 갖는 것</h3>
        <p><code>workspace.read</code> · <code>workspace.admin</code> · <code>voc.triage</code> · <code>voc.read</code>와 도메인 모듈 권한은 다음과 같습니다.</p>
        <table class="permission-table"><thead><tr><th>권한</th><th>Admin 역할 우회</th></tr></thead><tbody>${rightRows}</tbody></table>
        <p><strong>권한 판정의 최종 근거는 언제나 백엔드입니다.</strong> 화면 표시는 힌트일 뿐입니다.</p>
      `;
    }

    function renderChapter(chapter) {
      const special = chapter.type === 'faq' ? renderFaq() : chapter.type === 'permissions' ? renderPermissions() : '';
      const screens = chapter.screens.length
        ? `<div class="screen-grid">${chapter.screens.map((id) => chapterScreen(id, chapter.id, chapter.screens)).join('')}</div>`
        : '';
      return `
        <section class="chapter" id="${chapter.id}" data-chapter="${chapter.id}" data-audience="${chapter.audience.join(',')}">
          <div class="chapter-header"><div><p class="chapter-kicker">${chapter.number === 0 ? '시작하기' : `§${chapter.number}`}</p><h2>${esc(chapter.title)}</h2></div></div>
          <p class="role-note">필요 권한: ${chapter.permission}</p>
          <div class="chapter-copy">${chapter.copy}${special}</div>
          ${chapter.number === 0 ? renderStateBoard() : ''}
          ${screens}
        </section>
      `;
    }

    function renderTour() {
      const stepButtons = GUIDE.tour.map((step, index) => `
        <li><button type="button" data-tour-step="${index}" aria-current="${index === 0 ? 'step' : 'false'}">${index + 1}. ${esc(step.title)}</button></li>

      return `

          <p class="chapter-kicker">안내 따라가기</p><h2 id="tour-heading">업무 흐름 투어</h2>
          <p class="tour-intro">VOC 한 건의 여정을 단계별로 살펴봅니다. 각 단계는 해당 매뉴얼 장으로 이어집니다.</p>

            <div class="tour-current" id="tour-current" aria-live="polite"></div>
          </div>
        </section>
      `;
    }

    function renderScreenIndex() {
      const groups = GUIDE.screenGroups.map((group) => {
        const cards = group.ids.map((id) => {
          const screen = screensById[id];
          if (screen.chapters.length === 0) return chapterScreen(id, 'screens', group.ids);
          const chapterId = screen.chapters[0] || '';
          const chapterLink = chapterId
            ? `<a href="#${chapterId}">매뉴얼 장으로 이동</a>`
            : '<a href="#guide-footer">캡처 기준</a>';
          const sourceComment = screen.sourceComment ? `<!-- Source: ${esc(screen.sourceComment)}. -->` : '';
          return `
            <article class="catalog-card" data-catalog-card="${screen.id}">
              <img src="screens/${screen.id}.webp" alt="${esc(screen.alt)}" loading="lazy" width="1440" height="960"
                data-open-screen="${screen.id}" data-open-group="${group.ids.join(',')}" tabindex="0" role="button" aria-label="${esc(screen.title)} 확대 보기">
              <div><h3>${esc(screen.title)}</h3><p>${esc(screen.description)} ${sourceComment}</p>${chapterLink}</div>
            </article>
          `;
        }).join('');
        return `<details class="screen-group" open><summary>${esc(group.area)} · ${group.ids.length}개 화면</summary><div class="screen-catalog">${cards}</div></details>`;
      }).join('');
      return `
        <section class="screen-index" id="screens" aria-labelledby="screens-heading">
          <p class="chapter-kicker">화면 찾아보기</p><h2 id="screens-heading">메뉴별 화면</h2>
          <p class="screen-index-intro">현재 빌드에서 캡처한 35개 화면입니다. 숫자와 이름은 예시 데이터이며, 본문 설명의 기준은 USER-MANUAL.md입니다.</p>

    `;
    main.innerHTML = `${renderTour()}${GUIDE.chapters.map(renderChapter).join('')}${renderScreenIndex()}`;
    document.getElementById('guide-footer').innerHTML = `
      <p>${esc(GUIDE.footer)}</p>
      <p><a href="../USER-MANUAL.md">docs/USER-MANUAL.md</a>가 사용자 설명의 텍스트 기준입니다. 이 안내서와 매뉴얼을 함께 업데이트하세요.</p>
    `;

    function decorateGlossary(container, glossary, chapterId) {
      let serial = 0;
      for (const [term, definition] of Object.entries(glossary)) {
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            if (node.parentElement?.closest('a, button, code, script, style, .term-wrap')) return NodeFilter.FILTER_REJECT;
            return node.nodeValue.includes(term) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
          }
        });
        const node = walker.nextNode();
        if (!node) continue;
        const offset = node.nodeValue.indexOf(term);
        const before = node.nodeValue.slice(0, offset);
        const after = node.nodeValue.slice(offset + term.length);
        const id = `term-${chapterId}-${serial++}`;
        const wrapper = document.createElement('span');
        wrapper.className = 'term-wrap';
        const button = document.createElement('button');
        button.className = 'term-button';
        button.type = 'button';
        button.textContent = term;
        button.setAttribute('aria-describedby', `${id}-tip`);
        const tip = document.createElement('span');
        tip.className = 'term-popover';
        tip.id = `${id}-tip`;
        tip.setAttribute('role', 'tooltip');
        tip.hidden = true;
        tip.textContent = definition;
        wrapper.append(button, tip);
        const fragment = document.createDocumentFragment();
        if (before) fragment.append(document.createTextNode(before));
        fragment.append(wrapper);
        if (after) fragment.append(document.createTextNode(after));
        node.replaceWith(fragment);
        button.addEventListener('focus', () => { tip.hidden = false; });
        button.addEventListener('blur', () => { tip.hidden = true; });
        button.addEventListener('click', () => { tip.hidden = false; });
      }
    }
    GUIDE.chapters.forEach((chapter) => {
      const copy = document.querySelector(`#${chapter.id} .chapter-copy`);
      if (copy) decorateGlossary(copy, GUIDE.glossary, chapter.id);
    });

    function setRole(role) {
      selectedRole = role;
      document.querySelectorAll('#role-filter button').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.role === role));
      });
      document.querySelectorAll('[data-chapter]').forEach((chapterElement) => {
        const chapter = chaptersById[chapterElement.dataset.chapter];
        const allowed = role === 'all' || chapter.audience.includes(role);
        chapterElement.classList.toggle('muted', !allowed);
      });
      document.querySelectorAll('[data-role-row]').forEach((row) => {
        row.classList.toggle('role-row-active', role !== 'all' && row.dataset.roleRow === role);
      });
    }
    const roleFilter = document.getElementById('role-filter');
    roleFilter.innerHTML = `<span class="control-label">역할</span>${GUIDE.roles.map((role) => `<button class="pill-button" type="button" data-role="${role.id}" aria-pressed="${role.id === 'all'}">${esc(role.label)}</button>`).join('')}`;

    function updateTour(index) {
      tourIndex = (index + GUIDE.tour.length) % GUIDE.tour.length;
      const step = GUIDE.tour[tourIndex];
      const screen = screensById[step.screen];
      const groupIds = GUIDE.tour.map((item) => item.screen);
      const current = document.getElementById('tour-current');
      const focusedControl = document.activeElement?.closest('[data-tour-prev], [data-tour-next]');
      const focusSelector = focusedControl
        ? (focusedControl.hasAttribute('data-tour-prev') ? '[data-tour-prev]' : '[data-tour-next]')
        : null;
      const supplementalSources = step.source.split('; ').filter((source) => /^(CONTEXT\.md|docs\/design\/)/.test(source));
      const supplements = supplementalSources.length
        ? `<!-- Source: ${esc(supplementalSources.join('; '))}. -->`
        : '';
      current.innerHTML = `
        <p class="chapter-kicker">${tourIndex + 1} / ${GUIDE.tour.length}</p>
        <h3>${esc(step.title)}</h3>
        <div class="tour-progress" role="progressbar" aria-label="투어 진행률" aria-valuemin="0" aria-valuemax="${GUIDE.tour.length}" aria-valuenow="${tourIndex + 1}"><span style="width:${((tourIndex + 1) / GUIDE.tour.length) * 100}%"></span></div>
        <p><strong>누가:</strong> ${esc(step.who)}</p>${step.permission ? `<p><strong>${esc(step.permission)}</strong></p>` : ''}
        <p><strong>할 일:</strong> ${esc(step.what)}</p><p><strong>상태 변화:</strong> ${esc(step.change)}</p>
        ${supplements}
        <div class="catalog-card"><img src="screens/${screen.id}.webp" alt="${esc(screen.alt)}" width="1440" height="960" loading="lazy" data-open-screen="${screen.id}" data-open-group="${groupIds.join(',')}" tabindex="0" role="button" aria-label="${esc(screen.title)} 확대 보기"><div><h3>${esc(screen.title)}</h3><p>${esc(screen.description)}</p><button class="small-button" type="button" data-open-screen="${screen.id}" data-open-group="${groupIds.join(',')}">화면 확대</button></div></div>
        <p class="tour-meta">${esc(step.source)}</p>
        <p><a href="#${step.chapter}">매뉴얼의 해당 장으로 이동</a></p>
        <div class="tour-actions"><button class="small-button" type="button" data-tour-prev>← 이전</button><button class="small-button" type="button" data-tour-next>다음 →</button></div>
      `;
      document.querySelectorAll('[data-tour-step]').forEach((button) => {
        button.setAttribute('aria-current', String(Number(button.dataset.tourStep) === tourIndex ? 'step' : 'false'));
      });
      if (focusSelector) current.querySelector(focusSelector)?.focus();
    }
    updateTour(0);

    document.querySelectorAll('.state-choice').forEach((button) => {
      button.addEventListener('click', () => {
        const group = GUIDE.states.find((item) => item.id === button.dataset.stateGroup);
        document.querySelectorAll(`[data-state-group="${group.id}"]`).forEach((choice) => {
          choice.setAttribute('aria-pressed', String(choice === button));
        });
        const note = document.querySelector(`[data-state-note="${group.id}"]`);
        note.textContent = group.items[button.dataset.state] || `${button.dataset.state}: 매뉴얼에 상태 이름으로 나옵니다.`;
      });
    });

    function setHotspot(screenId, index) {
      activeScreenId = screenId;
      document.querySelectorAll('.shot-media').forEach((media) => {
        media.classList.toggle('has-active', media.dataset.shotMedia === screenId && index !== null);
      });
      document.querySelectorAll('[data-hotspot-screen]').forEach((button) => {
        const active = button.dataset.hotspotScreen === screenId && Number(button.dataset.hotspotIndex) === index;
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function showViewerSlide(index) {
      if (!viewerIds.length) return;
      viewerIndex = (index + viewerIds.length) % viewerIds.length;
      const screen = screensById[viewerIds[viewerIndex]];
      if (!screen) return;
      viewerImage.src = `screens/${screen.id}.webp`;
      viewerImage.alt = screen.alt;
      viewerTitle.textContent = `${screen.title} · ${viewerIndex + 1} / ${viewerIds.length}`;
      viewerCaption.textContent = screen.description;
    }

    function openViewer(screenId, ids) {
      viewerIds = ids.filter((id) => screensById[id]);
      if (!viewerIds.includes(screenId)) viewerIds.unshift(screenId);
      showViewerSlide(viewerIds.indexOf(screenId));
      if (!viewer.open) viewer.showModal();
    }

    function searchText(node) {
      return `${node.textContent ?? ''} ${[...node.querySelectorAll('img')].map((image) => image.alt).join(' ')}`.toLocaleLowerCase();
    }
    function applySearch() {
      const query = searchInput.value.trim().toLocaleLowerCase();
      let matches = 0;
      document.querySelectorAll('[data-chapter]').forEach((chapter) => {
        const found = !query || searchText(chapter).includes(query);
        chapter.hidden = !found;
        if (found && query) matches += 1;
      });
      document.querySelectorAll('.faq-item').forEach((item) => {
        const found = !query || searchText(item).includes(query);
        item.hidden = !found;
        if (found && query) matches += 1;
      });
      document.querySelectorAll('[data-catalog-card]').forEach((card) => {
        const found = !query || searchText(card).includes(query);
        card.hidden = !found;
        if (found && query) matches += 1;
      });
      document.querySelectorAll('.screen-group').forEach((group) => {
        group.hidden = !group.querySelector('[data-catalog-card]:not([hidden])');
      });
      document.querySelectorAll('.nav-link').forEach((link) => {
        const targetId = link.getAttribute('href').slice(1);
        const target = document.getElementById(targetId);
        link.hidden = Boolean(query && target?.hidden);
      });
      searchStatus.textContent = query ? `${matches}곳에서 찾음` : '전체 안내';
    }

    document.addEventListener('click', (event) => {
      const roleButton = event.target.closest('[data-role]');
      if (roleButton) setRole(roleButton.dataset.role);
      const hotspot = event.target.closest('[data-hotspot-screen]');
      if (hotspot) setHotspot(hotspot.dataset.hotspotScreen, Number(hotspot.dataset.hotspotIndex));
      const openButton = event.target.closest('[data-open-screen]');
      if (openButton) openViewer(openButton.dataset.openScreen, (openButton.dataset.openGroup || openButton.dataset.openScreen).split(','));
      const tourButton = event.target.closest('[data-tour-step]');
      if (tourButton) updateTour(Number(tourButton.dataset.tourStep));
      if (event.target.closest('[data-tour-prev]')) updateTour(tourIndex - 1);
      if (event.target.closest('[data-tour-next]')) updateTour(tourIndex + 1);
    });
    document.addEventListener('focusin', (event) => {
      const hotspot = event.target.closest('[data-hotspot-screen]');
      if (hotspot) setHotspot(hotspot.dataset.hotspotScreen, Number(hotspot.dataset.hotspotIndex));
    });
    searchInput.addEventListener('input', applySearch);
    document.getElementById('nav-toggle').addEventListener('click', (event) => {
      const button = event.currentTarget;
      const open = button.getAttribute('aria-expanded') !== 'true';
      button.setAttribute('aria-expanded', String(open));
      button.textContent = open ? '목차 접기' : '목차 펼치기';
      nav.classList.toggle('is-open', open);
    });
    nav.addEventListener('click', (event) => {
      if (event.target.closest('a') && window.matchMedia('(max-width: 999px)').matches) {
        nav.classList.remove('is-open');
        document.getElementById('nav-toggle').setAttribute('aria-expanded', 'false');
        document.getElementById('nav-toggle').textContent = '목차 펼치기';
      }
    });
    document.getElementById('viewer-prev').addEventListener('click', () => showViewerSlide(viewerIndex - 1));
    document.getElementById('viewer-next').addEventListener('click', () => showViewerSlide(viewerIndex + 1));
    document.getElementById('viewer-close').addEventListener('click', () => viewer.close());
    document.getElementById('viewer').addEventListener('click', (event) => {
      if (event.target === viewer) viewer.close();
    });
    document.getElementById('theme-toggle').addEventListener('click', (event) => {
      const useDark = document.documentElement.dataset.theme
        ? document.documentElement.dataset.theme !== 'dark'
        : !window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = useDark ? 'dark' : 'light';
      event.currentTarget.setAttribute('aria-pressed', String(useDark));
      event.currentTarget.textContent = useDark ? '밝은 테마' : '어두운 테마';
      try { localStorage.setItem('feedbackops-guide-theme', useDark ? 'dark' : 'light'); } catch (_) { /* file:// storage may be unavailable */ }
    });
    try {
      const savedTheme = localStorage.getItem('feedbackops-guide-theme');
      if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
    } catch (_) { /* file:// storage may be unavailable */ }
    const themeToggle = document.getElementById('theme-toggle');
    const initiallyDark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    themeToggle.setAttribute('aria-pressed', String(initiallyDark));
    themeToggle.textContent = initiallyDark ? '밝은 테마' : '어두운 테마';

    document.addEventListener('keydown', (event) => {
      if (viewer.open) {
        if (event.key === 'ArrowLeft') { event.preventDefault(); showViewerSlide(viewerIndex - 1); }
        if (event.key === 'ArrowRight') { event.preventDefault(); showViewerSlide(viewerIndex + 1); }
        if (event.key === 'Escape') viewer.close();
        return;
      }
      if (event.key === 'Escape') {
        if (searchInput.value) { searchInput.value = ''; applySearch(); }
        if (activeScreenId) setHotspot(activeScreenId, null);
        document.querySelectorAll('.term-popover:not([hidden])').forEach((tip) => { tip.hidden = true; });
      }
      if (event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      const imageButton = event.target.closest('img[data-open-screen][role="button"]');
      if (imageButton && (event.key === 'Enter' || event.key === ' ')) {
        event.preventDefault();
        imageButton.click();
        return;
      }
      if (!event.target.closest('#tour')) return;
      if (event.key === 'ArrowLeft') updateTour(tourIndex - 1);
      if (event.key === 'ArrowRight') updateTour(tourIndex + 1);
    });

    document.querySelectorAll('.nav-link').forEach((link) => link.addEventListener('click', () => {
      document.querySelectorAll('.nav-link').forEach((item) => item.removeAttribute('aria-current'));
      link.setAttribute('aria-current', 'location');
    }));
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver((entries) => {
        const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (!visible) return;
        document.querySelectorAll('.nav-link').forEach((link) => {
          if (link.getAttribute('href') === `#${visible.target.id}`) link.setAttribute('aria-current', 'location');
          else link.removeAttribute('aria-current');
        });
      }, { rootMargin: '-10% 0px -78% 0px', threshold: 0 });
      document.querySelectorAll('main > section[id]').forEach((section) => observer.observe(section));
    }
    setRole(selectedRole);
    applySearch();
  </script>
</body>
</html>
